name: Windows

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Read variables from repo
        shell: bash
        run: |
          export $(cat .github/workflows/env)
          cat .github/workflows/env >> $GITHUB_ENV
          echo CACHE_KEY=${{ runner.os }}-py-$PYVER-${{ hashFiles('build-helper.bat', 'helper/**')}} >> $GITHUB_ENV
          echo "SIGN=${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}" >> $GITHUB_ENV

      - name: Check app versions
        run: |
          python set-version.py
          git diff --exit-code

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYVER }}

      - name: Update pip
        run: python -m pip install --upgrade pip

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Cache helper
        id: cache-helper
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            build/windows/helper
            assets/licenses/helper.json
          key: ${{ env.CACHE_KEY }}

      - name: Build the Helper
        if: steps.cache-helper.outputs.cache-hit != 'true'
        run: .\build-helper.bat

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER }}
      - run: flutter config --enable-windows-desktop
      - run: flutter --version
      - run: flutter pub get

      - name: Run lints/tests
        env:
          SKIP: ${{ steps.cache-helper.outputs.cache-hit == 'true' && 'mypy,ruff check,ruff format' || ''}}
        run: |
          uv tool install pre-commit
          pre-commit run --all-files
          flutter test

      - name: Build the app
        run: |
          $version = python set-version.py | select-object -first 1
          flutter build windows --build-name=$version

      - name: Check generated files
        run: git diff -I '.*android.*flutter_plugins.*qrscanner_zxing' --exit-code

      - name: Move .dll files
        run: |
          $dest = "build\windows\x64\runner\Release"
          cp $dest\helper\_internal/MSVCP140.dll $dest\
          cp $dest\helper\_internal/VCRUNTIME140.dll $dest\
          cp $dest\helper\_internal/VCRUNTIME140_1.dll $dest\

      - name: Rename and archive app bundle
        run: |
          $dest = "deploy\seedkeeper-pro-windows"
          mkdir $dest
          mv build\windows\x64\runner\Release\* $dest\
          mv resources\win\release-win.ps1 deploy
          mv resources\win\verify_dll.ps1 deploy
          mv resources deploy
          "WIN_APP_DIR=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Sign exe/dll with Azure Trusted Signing
        if: env.SIGN == 'true'
        uses: azure/trusted-signing-action@208f8af4bf26cf2af8597424e3cb5582801523ba # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: ${{ env.WIN_APP_DIR }}
          files-folder-filter: dll,exe
          files-folder-recurse: true
          timeout: 600

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seedkeeper-pro-windows
          path: deploy

  build-msi:
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: [build]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download signed app artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: seedkeeper-pro-windows
          path: signed-files

      - name: Read variables from repo
        shell: bash
        run: cat .github/workflows/env >> $GITHUB_ENV

      - name: Create an unsigned .msi installer package
        run: |
          $env:PATH += ";$env:WIX\bin"
          $env:SRCDIR = "signed-files\seedkeeper-pro-windows\"
          heat dir .\signed-files\seedkeeper-pro-windows\ -out fragment.wxs -gg -scom -srd -sfrag -dr INSTALLDIR -cg ApplicationFiles -var env.SRCDIR
          candle .\fragment.wxs .\resources\win\yubioath-desktop.wxs -ext WixUtilExtension -arch x64
          light fragment.wixobj yubioath-desktop.wixobj -ext WixUIExtension -ext WixUtilExtension -o seedkeeper-pro-windows.msi

      - name: Move .msi into installer dir
        run: |
          mkdir installer
          mv seedkeeper-pro-windows.msi installer

      - name: Sign MSI with Azure Trusted Signing
        uses: azure/trusted-signing-action@208f8af4bf26cf2af8597424e3cb5582801523ba # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: installer
          files-folder-filter: msi

      - name: Upload signed installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-installer
          path: installer
          if-no-files-found: error
          compression-level: 0

  verify-signatures:
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: [build-msi]
    runs-on: windows-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: seedkeeper-pro-windows
          path: downloaded-artifact

      - name: Check for unsigned DLLs
        working-directory: .\downloaded-artifact
        run: .\verify_dll.ps1
