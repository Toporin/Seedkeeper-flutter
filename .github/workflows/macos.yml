name: macOS

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Read variables from repo
      run: |
        export $(cat .github/workflows/env)
        cat .github/workflows/env >> $GITHUB_ENV
        echo CACHE_KEY=${{ runner.os }}-py$PYVER-${{ hashFiles('build-helper.sh', 'helper/**')}} >> $GITHUB_ENV
        echo "SIGN=${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}" >> $GITHUB_ENV

    - name: Check app versions
      run: |
        python3 set-version.py
        git diff --exit-code

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: ${{ env.PYVER }}

    - name: Set up CocoaPods
      uses: maxim-lobanov/setup-cocoapods@8e97e1e98e6ccf42564fdf5622c8feec74199377 # v1.4.0
      with:
        podfile-path: macos/Podfile.lock

    - name: Install uv
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      with:
        enable-cache: true

    - name: Cache helper
      id: cache-helper
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: |
          build/macos/helper
          assets/licenses/helper.json
        key: ${{ env.CACHE_KEY }}

    - name: Install dependencies
      if: steps.cache-helper.outputs.cache-hit != 'true'
      run: |
        brew update
        brew install swig
        python -m pip install --upgrade pip

    - name: Build the Helper
      if: steps.cache-helper.outputs.cache-hit != 'true'
      run: ./build-helper.sh

    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        channel: 'stable'
        flutter-version: ${{ env.FLUTTER }}
    - run: flutter config --enable-macos-desktop
    - run: flutter --version
    - run: flutter pub get

    - name: Run lints/tests
      env:
        SKIP: ${{ steps.cache-helper.outputs.cache-hit == 'true' && 'mypy,ruff check,ruff format' || ''}}
      run: |
        uv tool install pre-commit
        pre-commit run --all-files
        flutter test

    - name: Build the app
      run: |
        export VERSION_NAME=`./set-version.py | head -n 1 | sed 's/-.*$//g'`
        flutter build macos --build-name=$VERSION_NAME

    - name: Check generated files
      run: git diff --exit-code

    - name: Import signing certificate
      if: env.SIGN == 'true'
      env:
        MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      run: |
        echo "$MACOS_CERTIFICATE" | base64 --decode -o certificate.p12
        security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
        security default-keychain -s build.keychain
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
        security set-keychain-settings -lut 21600 build.keychain
        security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
        security list-keychains -d user -s build.keychain
        rm certificate.p12

    - name: Sign the app
      if: env.SIGN == 'true'
      env:
        MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      run: |
        APP="build/macos/Build/Products/Release/Seedkeeper PRO Manager.app"
        IDENTITY="$MACOS_SIGN_IDENTITY"
        # Sign the helper binary, with entitlements + hardened runtime
        codesign -f --timestamp --options runtime --entitlements macos/helper.entitlements \
          --sign "$IDENTITY" "$APP/Contents/Resources/helper/authenticator-helper"
        # Sign the dylib and .so files, without entitlements
        # Use find -exec so paths containing spaces (the .app name) are passed intact
        find "$APP/Contents/Resources/helper/_internal/" \( -name "*.dylib" -o -name "*.so" \) \
          -exec codesign -f --timestamp --options runtime --sign "$IDENTITY" {} +
        # Sign the bundled Python binary, without entitlements
        codesign -f --timestamp --options runtime --sign "$IDENTITY" \
          "$APP/Contents/Resources/helper/_internal/Python"
        # Sign the GUI, deep, with Release entitlements
        codesign -f --timestamp --options runtime --entitlements macos/Runner/Release.entitlements \
          --deep --sign "$IDENTITY" "$APP"

    - name: Notarize and staple the app
      if: env.SIGN == 'true'
      env:
        MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
        MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
        MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
      run: |
        APP="build/macos/Build/Products/Release/Seedkeeper PRO Manager.app"
        echo "$MACOS_NOTARY_KEY" | base64 --decode -o notary_key.p8
        ditto -c -k --sequesterRsrc --keepParent "$APP" "Seedkeeper PRO Manager.zip"
        xcrun notarytool submit "Seedkeeper PRO Manager.zip" \
          --key notary_key.p8 --key-id "$MACOS_NOTARY_KEY_ID" --issuer "$MACOS_NOTARY_ISSUER_ID" --wait
        xcrun stapler staple -v "$APP"
        rm notary_key.p8 "Seedkeeper PRO Manager.zip"

    - name: Create dmg
      run: |
        brew install create-dmg
        mkdir source_folder
        cp -R build/macos/Build/Products/Release/"Seedkeeper PRO Manager.app" source_folder
        cp resources/icons/dmg-background.png .
        sh create-dmg.sh

    - name: Sign, notarize and staple the dmg
      if: env.SIGN == 'true'
      env:
        MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
        MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
        MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
      run: |
        codesign -f --timestamp --options runtime --sign "$MACOS_SIGN_IDENTITY" yubioath-desktop.dmg
        echo "$MACOS_NOTARY_KEY" | base64 --decode -o notary_key.p8
        xcrun notarytool submit yubioath-desktop.dmg \
          --key notary_key.p8 --key-id "$MACOS_NOTARY_KEY_ID" --issuer "$MACOS_NOTARY_ISSUER_ID" --wait
        xcrun stapler staple -v yubioath-desktop.dmg
        rm notary_key.p8

    - name: Rename and archive app bundle
      run: |
        export REF=$(echo ${GITHUB_REF} | cut -d '/' -f 3)
        mkdir deploy
        mv yubioath-desktop.dmg deploy
        tar -czf deploy/yubioath-desktop-${REF}.app.tar.gz -C build/macos/Build/Products/Release "Seedkeeper PRO Manager.app"
        mv create-dmg.sh deploy
        mv resources/icons/dmg-background.png deploy
        mv macos/helper.entitlements deploy
        mv macos/helper-sandbox.entitlements deploy
        mv macos/Runner/Release.entitlements deploy
        mv macos/release-macos.sh deploy

    - name: Upload artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: yubioath-desktop-macos
        path: deploy
