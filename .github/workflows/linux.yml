name: Linux

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
      env:
        DEBIAN_FRONTEND: noninteractive

    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        sparse-checkout: .github/workflows/env

    - name: Read variables from repo
      run: |
        export $(cat .github/workflows/env)
        cat .github/workflows/env >> $GITHUB_ENV
        echo CACHE_KEY=${{ runner.os }}-py$PYVER-${{ hashFiles('build-helper.sh', 'helper/**')}} >> $GITHUB_ENV

    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -qq curl ca-certificates software-properties-common libnotify-dev libayatana-appindicator3-dev patchelf
        # pre-commit needs git >= 2.31 (it runs `git ls-files --deduplicate`), but
        # focal ships git 2.25. Pull a newer git from the git-core PPA added over
        # HTTPS with [trusted=yes], so we depend on TLS to Launchpad instead of the
        # flaky hkp GPG keyserver that add-apt-repository would otherwise contact.
        echo "deb [trusted=yes] https://ppa.launchpadcontent.net/git-core/ppa/ubuntu focal main" > /etc/apt/sources.list.d/git-core-ppa.list
        apt-get update
        apt-get install -qq git
        git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Install uv
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      with:
        enable-cache: true

    - name: Install Python
      run: |
        uv python install $PYVER

    - name: Check app versions
      run: |
        uv run python set-version.py
        git diff --exit-code

    - name: Cache helper
      id: cache-helper
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: |
          build/linux/helper
          assets/licenses/helper.json
        key: ${{ env.CACHE_KEY }}

    - name: Build the Helper
      if: steps.cache-helper.outputs.cache-hit != 'true'
      run: |
        # gcc-13 comes from the ubuntu-toolchain-r PPA; add it over HTTPS with
        # [trusted=yes] to avoid the flaky hkp GPG keyserver (TLS to Launchpad
        # authenticates the source instead).
        echo "deb [trusted=yes] https://ppa.launchpadcontent.net/ubuntu-toolchain-r/test/ubuntu focal main" > /etc/apt/sources.list.d/ubuntu-toolchain-r.list
        apt update -y
        apt-get install -qq swig libpcsclite-dev build-essential cmake gcc-13 g++-13
        update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 60 --slave /usr/bin/g++ g++ /usr/bin/g++-13 
        update-alternatives --config gcc
        ./build-helper.sh

    - name: Install Flutter dependencies
      run: |
        apt-get install -qq clang cmake ninja-build pkg-config libgtk-3-dev jq lld

    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        channel: 'stable'
        flutter-version: ${{ env.FLUTTER }}

    - name: Configure Flutter
      run: |
        git config --global --add safe.directory $FLUTTER_ROOT
        flutter config --enable-linux-desktop
        flutter --version
        flutter pub get

    - name: Run lints/tests
      env:
        SKIP: ${{ steps.cache-helper.outputs.cache-hit == 'true' && 'mypy,ruff check,ruff format' || ''}}
      run: |
        uvx pre-commit run --all-files
        flutter test

    - name: Build the app
      run: flutter build linux

    - name: Check generated files
      run: git diff --exit-code

    - name: Embedd appindicator
      run: |
        patchelf --set-rpath '$ORIGIN' build/linux/x64/release/bundle/lib/libtray_manager_plugin.so
        cp -L /usr/lib/x86_64-linux-gnu/libayatana-appindicator3.so.1 build/linux/x64/release/bundle/lib/
        patchelf --set-rpath '$ORIGIN' build/linux/x64/release/bundle/lib/libayatana-appindicator3.so.1
        cp -L /usr/lib/x86_64-linux-gnu/libayatana-indicator3.so.7 build/linux/x64/release/bundle/lib/
        patchelf --set-rpath '$ORIGIN' build/linux/x64/release/bundle/lib/libayatana-indicator3.so.7
        cp -L /usr/lib/x86_64-linux-gnu/libdbusmenu-glib.so.4 build/linux/x64/release/bundle/lib/
        patchelf --set-rpath '$ORIGIN' build/linux/x64/release/bundle/lib/libdbusmenu-glib.so.4
        cp -L /usr/lib/x86_64-linux-gnu/libdbusmenu-gtk3.so.4 build/linux/x64/release/bundle/lib/
        patchelf --set-rpath '$ORIGIN' build/linux/x64/release/bundle/lib/libdbusmenu-gtk3.so.4

    - name: Rename and archive app
      run: |
        export REF=$(echo ${GITHUB_REF} | cut -d '/' -f 3)
        export BASENAME="seedkeeper-pro-linux"
        mkdir deploy
        mv build/linux/x64/release/bundle "build/${BASENAME}"
        tar -czf deploy/${BASENAME}.tar.gz -C build "${BASENAME}"

    - name: Upload artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: seedkeeper-pro-linux
        path: deploy
