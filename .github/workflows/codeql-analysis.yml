name: "CodeQL"

on:
  push:
    paths:
      - "android/**"
      - "helper/**"
  pull_request:
    paths:
      - "android/**"
      - "helper/**"
  schedule:
    - cron: '0 11 * * 3'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # Python needs no build; buildless extraction is sufficient.
          - language: python
            build-mode: none
          # Kotlin cannot be extracted buildless, so it must be compiled.
          # We do a minimal *compile* (see the build step) rather than a
          # release build to keep the runner within its memory budget.
          - language: java-kotlin
            build-mode: manual

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Read variables from repo
        run: cat .github/workflows/env >> "$GITHUB_ENV"

      - name: Set up JDK 21
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Flutter
        if: matrix.language == 'java-kotlin'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER }}

      - name: Prepare Flutter/Gradle project
        if: matrix.language == 'java-kotlin'
        run: |
          flutter --version
          flutter pub get
          # The Flutter Gradle build reads flutter.sdk from local.properties
          # (see android/settings.gradle). Generate it instead of running a
          # full "flutter build", which is what we're avoiding.
          {
            echo "flutter.sdk=$FLUTTER_ROOT"
            echo "sdk.dir=$ANDROID_SDK_ROOT"
          } > android/local.properties

      - name: Initialize CodeQL
        uses: github/codeql-action/init@87557b9c84dde89fdd9b10e88954ac2f4248e463 # v4.36.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Compile only — no release APK, no R8/minify, no split-per-abi, no
      # signing, no collectLicenses. This is enough for CodeQL to trace the
      # Kotlin/Java (including the yubikit-android composite build used for
      # FIDO). --no-daemon and in-process kotlinc ensure the build JVM exits
      # and frees RAM before the analyze step allocates CODEQL_RAM, which is
      # what previously exhausted the 16 GB runner.
      - name: Compile Kotlin/Java for CodeQL
        if: matrix.language == 'java-kotlin'
        working-directory: android
        run: |
          ./gradlew :app:compileDebugKotlin :app:compileDebugJavaWithJavac \
            --no-daemon --console=plain \
            -Dkotlin.compiler.execution.strategy=in-process

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@87557b9c84dde89fdd9b10e88954ac2f4248e463 # v4.36.1
